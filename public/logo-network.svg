<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="network-title network-description">
  <title id="network-title">TinyBrains — neural network</title>
  <desc id="network-description">A brain in side view outlined by a sparse network of coloured nodes. Cobalt, teal, violet, sky blue and orange distinguish the brain regions. A double grey stem completes the silhouette.</desc>

  <!-- The outside connections form the lateral brain silhouette. -->
  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#76A7FF" d="M222 94 154 102 100 134 66 184 54 236 78 274 126 282 174 248"/>
    <path stroke="#50D6CE" d="M222 94 292 90 358 110 410 150"/>
    <path stroke="#A194FF" d="M410 150 444 200 450 250 422 286 366 278"/>
    <path stroke="#74C6F5" d="M174 248 150 298 188 332 244 336 298 312 366 278"/>

    <!-- Just four interior branches suggest neural pathways. -->
    <path stroke="#76A7FF" d="M100 134 154 190 174 248 M54 236 154 190"/>
    <path stroke="#50D6CE" d="M222 94 244 186 154 190 M244 186 358 110"/>
    <path stroke="#A194FF" d="M244 186 350 204 444 200 M350 204 366 278"/>
    <path stroke="#74C6F5" d="M174 248 274 254 350 204 M274 254 244 336"/>

    <!-- Cerebellum and brainstem make the side profile distinctive. -->
    <path stroke="#FF9776" d="M366 278 406 310 398 346 360 364 320 344 322 310 366 278 M322 310 398 346"/>
    <path stroke="#99ADC9" stroke-width="12" d="M298 312 288 364 316 410"/>
    <path stroke="#99ADC9" stroke-width="12" d="M263 328 256 364 284 410 316 410"/>
  </g>

