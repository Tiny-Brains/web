# The /v1 proxy is not a convenience -- it is what makes the auth flow work.
#
# Soma sets `soma_session` as an HttpOnly cookie with no Domain attribute, so the
# cookie belongs to whichever host the browser believes answered. Proxying means the
# browser only ever sees this origin: the cookie is set here, sent back on every
# /v1 call, and nothing is cross-origin, so no CORS is involved. Talking to
# soma:8080 directly from the page would need CORS *with credentials*, and Orion
# answers `access-control-allow-origin: *`, which browsers refuse to combine
# with them.
#
# This mirrors the Vite dev proxy in vite.config.ts, so the OAuth callback URL
# registered with GitHub is the same in both.

# The scheme a link unfurler should be told, for og:image below. Behind a TLS terminator this
# server hears plain http, and X-Forwarded-Proto is how the terminator says otherwise.
map $http_x_forwarded_proto $og_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # `soma` is the compose service name of the orion-server that holds Soma -- renamed
    # from `orion` by devops/docs/deployment.md, when the one server became two and the other one plays
    # matches. With a literal upstream nginx resolves it once at startup and keeps that
    # address for the life of the process -- so when it is rebuilt and recreated (every
    # image upgrade) the proxy keeps sending /v1 to whichever container inherits the old
    # address, which is how the 1.6.0 upgrade briefly served Orion's console at
    # /v1/games. A variable upstream is resolved per request through Docker's
    # embedded DNS instead -- which now also means `--scale soma=2` load-balances, since
    # the embedded DNS returns every replica's address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $soma http://soma:8080;

    # SIGN-IN FAILURES, INTERCEPTED -- soma/gaps.md 1.7. Orion's oauth2_login answers a
    # FIXED 401 at this path when the state cookie did not arrive, when GitHub was refused
    # consent, or when GitHub did not answer; the reason goes to a metrics counter and the
    # workflow never runs, so there is nothing Soma can shape. Left alone, the browser
    # stops on an API error page and /signin/callback -- a page written for exactly these
    # three states -- is unreachable.
    #
    # So the ONE status this one path can only mean "sign-in did not complete" is turned
    # into a redirect to that page. It is a workaround and it loses which of the three it
    # was, because nginx cannot see what the counter saw: the page leads with the missing
    # state cookie, which is the common case and the one that traps a sign-in begun on
    # localhost and finished on 127.0.0.1. The proper fix is a `failure_redirect` on
    # oauth2_login, and it is written out in soma/gaps.md 1.7.
    #
    # SUCCESS IS UNTOUCHED. This block intercepts errors, which the /v1/ block below
    # deliberately does not -- a 302 to GitHub and the 302 back that carries Set-Cookie
    # must both reach the browser exactly as Soma wrote them.
    location = /v1/auth/github/callback {
        proxy_pass         $soma;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect         off;
        proxy_intercept_errors on;
        error_page 401 = @signin_failed;
    }

    location @signin_failed {
        absolute_redirect off;
        return 302 /signin/callback?error=incomplete;
    }

    location /v1/ {
        proxy_pass         $soma;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The OAuth endpoints answer 302 -- to github.com on the way out, to the app
        # on the way back. Both must reach the browser untouched: rewriting the
        # Location header would break the round trip, and swallowing the response
        # would drop the Set-Cookie that rides along with it.
        proxy_redirect          off;
        proxy_intercept_errors  off;
    }

    # Hashed assets are immutable; index.html must not be cached or a deploy is
    # invisible until the browser gives up on it.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";

        # THE UNFURL IMAGE NEEDS AN ABSOLUTE URL. Open Graph scrapers do not resolve a relative
        # og:image, and this image must serve on any host -- a build argument would bake one
        # host into an image a deployment is meant to pin by tag. So index.html carries the
        # path and this rewrites it to whatever host the request arrived on, once per
        # occurrence (og:image and twitter:image). Every route is served through this location:
        # the SPA fallback, the root, and @docs_missing all end here by internal redirect.
        sub_filter      'content="/og.png"' 'content="$og_scheme://$http_host/og.png"';
        sub_filter_once off;
    }

    # THE GAME VIEWERS, built in. web/scripts/vendor-viewers.sh copies each registered
    # game's viewer out of its own repository into public/cartridges/<slug>/, so these are
    # part of the bundle rather than something a deployment mounts.
    #
    # A LOCATION OF ITS OWN, so a missing file 404s. Under the SPA fallback below,
    # /cartridges/ants/engine/tb-ants.core.wasm would answer index.html with a 200, and
    # WebAssembly.compileStreaming would then fail on the content type rather than on
    # the file being absent -- an error that says nothing about what is wrong.
    #
    # NOT immutable: these filenames carry no content hash, so an engine cutover would be
    # invisible behind a long max-age. The defaults revalidate, which is what a file that
    # changes under a fixed name needs. nginx's own mime.types maps .wasm to
    # application/wasm, which compileStreaming requires.
    location /cartridges/ {
        try_files $uri =404;
    }

    # THE BOOK, mounted rather than built in: it is its own repository
    # (Tiny-Brains/docs) and this image's build context is web/ alone, so DevOps binds the
    # rendered book here and a deployment bakes it in at the same path.
    location /docs/ {
        alias /usr/share/nginx/html/docs/;

        # `$uri.html` FIRST, and the order is load-bearing. mdbook writes quickstart.html
        # while every link the site makes is extensionless, so `$uri.html` is what resolves
        # them at all. It goes first because /docs/models/adapters is BOTH a page
        # (adapters.html) and a section with children (adapters/dialect.html): with `$uri`
        # first, nginx matches the directory, 301s to a trailing slash, and the chapter with
        # the same name becomes unreachable.
        try_files $uri.html $uri $uri/ @docs_missing;

        # nginx builds an absolute Location from its own server_name and listen port, and
        # this server listens on 80 inside a container published on 5173 -- an absolute
        # redirect sends the browser to a port nothing answers on. Relative redirects keep
        # whatever host and port the request arrived with.
        absolute_redirect off;

        # mdbook's own 404 page, served WITH a 404 status. As a try_files fallback it would
        # answer 200, which tells a crawler the page exists and a reader nothing.
        error_page 404 /docs/404.html;
    }

    # A book page that is not there, and the two things that can mean. With a book mounted it
    # is a chapter the book lacks: the book's own 404, with its status. With NO book mounted --
    # a deployment that has not built one, or the local stack before `mdbook build` -- every
    # Docs link on the site used to answer nginx's bare 404 page. The application has a page
    # for exactly that (`/docs/*` in src/App.tsx), which sends the reader to the chapter's
    # source; it only gets to render if index.html is what answers.
    location @docs_missing {
        error_page 404 /docs/404.html;
        if (-f /usr/share/nginx/html/docs/index.html) { return 404; }
        rewrite ^ /index.html last;
    }

    # `/docs` with no slash, so the footer link does not depend on one.
    location = /docs {
        absolute_redirect off;
        return 301 /docs/;
    }

    # SPA fallback, last so it does not shadow the rules above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
