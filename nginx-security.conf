# THE HEADERS EVERY RESPONSE FROM THIS SERVER CARRIES.
#
# A file of its own, included rather than repeated, because of how `add_header` inherits: a
# location that declares one of its own inherits NONE from the level above it. Four locations here
# set their own Cache-Control, so without this the security headers would silently vanish from the
# application's HTML, its hashed assets, the feed and the sitemap -- which is every response that
# matters. `always` sends them on error responses too.
#
# What is NOT here is the Content-Security-Policy. It is set on `location = /index.html` alone,
# because every route of the application reaches that file by internal redirect while the book at
# /docs/ is mdBook's own HTML with its own inline scripts, and one policy cannot serve both.

add_header X-Content-Type-Options   "nosniff"                          always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
# Belt and braces with the policy's frame-ancestors, for anything that predates it.
add_header X-Frame-Options          "SAMEORIGIN"                       always;
