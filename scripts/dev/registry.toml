# The games this deployment's checkouts play, for the `tinybrains` CLI (github.com/Tiny-Brains/cli)
# -- the same things `soma bootstrap` writes onto the `games` row, in a form that needs no
# database and no network, so a local check resolves a game against THE SAME digest string the
# ladder pins.
#
# NOTHING FINDS THIS FILE BY ITSELF. The binary looked here while it was built from `devops/cli`,
# by compiling this path into itself; it no longer does (decision N23). `scripts/dev/submission-
# storm.py` passes it as TINYBRAINS_REGISTRY, and so can you, from web's root:
#
#   TINYBRAINS_REGISTRY=scripts/dev/registry.toml tinybrains games
#
#   path      an artifact set on disk: a sibling checkout's dist/, or an image's /artifacts/ copied
#             out, which is the same tree. The digest is whatever the file hashes to, and is
#             REPORTED rather than pinned: it changes on every build, so pinning it could only ever
#             be wrong.
#   release   the same tree as ONE archive on a GitHub release, unpacked under
#             ~/.cache/tinybrains/cartridges/<archive digest>/. PINNED: refused unless the archive
#             hashes to `artifacts.sha256` and the component inside it to `engine`. This is what
#             every `<game>-starter` uses, so a competitor needs no checkout (decisions N21, N22).
#
# Adding a game is an entry here and no Rust at all.

[games.ants]
name = "Ants"
# The build output of an ants checkout beside this one: `ants/build.sh`, then `ants/viz/build.sh`.
path = "../../../ants/dist"

# A release instead, as the notes of an ants release print it. `tinybrains games` reports which way it
# resolved; `path` wins when both are present.
#
# repo      = "Tiny-Brains/ants"
# release   = "engine-281a84f10d59"
# artifacts = { file = "ants-artifacts.tar.gz", sha256 = "sha256:..." }
# engine    = "sha256:..."                                            # == games.active_engine_digest
