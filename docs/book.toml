[book]
title = "TinyBrains"
description = "Build small neural networks, compete in strategy games, and improve your models. A guide for TinyBrains competitors."
authors = []
language = "en-GB"
src = "src"

[build]
build-dir = "book"
create-missing = false          # a SUMMARY entry with no file is an error, not a new stub

[output.html]
# THE ORDER OF additional-css IS THE MECHANISM. mdBook writes its own variables.css, general.css
# and chrome.css into every page and appends these afterwards, so tokens.css can answer mdBook's
# palette and tinybrains.css can restate the application's components without an !important in
# sight. tokens.css comes first because the other two are written against it.
#
# tokens.css   the application's palette: an @import of its /design-system/tokens.css
# tinybrains.css  mdBook's variables answered in Cobalt, and the site's bar, footer and components
# tb-replay.css   the frame around an embedded match
# tb-studio.css   the slot DataLogic Studio mounts in, and the link under every adapter example
additional-css = ["theme/tokens.css", "theme/tinybrains.css", "theme/tb-replay.css", "theme/tb-studio.css"]

# tb-words.js FIRST: it is the one table of every sentence the chrome says, in every language the
# book is built in, and the three scripts after it read from it. tb-replay.js is the replay
# viewer, on any page that has a `.tb-replay` slot; it pulls the viewer module in only when a page
# actually uses one -- the cartridge is a quarter of a megabyte and most pages do not want it.
# tb-site.js lays the page's language over the bar, draws the language picker, and wires the
# bar's theme button to mdBook's own theme machinery. tb-studio.js does the same for DataLogic
# Studio, which is five megabytes and comes from the Studio's own site, and waits until a slot
# scrolls into view before fetching it. theme/head.hbs, the head partial, is where the languages
# and the forward to the reader's one live.
additional-js = ["theme/tb-words.js", "theme/tb-replay.js", "theme/tb-site.js", "theme/tb-studio.js"]

# Cobalt's default is dark, and so is the book's. `navy` and `light` are the two theme names
# theme/index.hbs offers; both are load-bearing names, not labels -- see the note there.
default-theme = "navy"
preferred-dark-theme = "navy"
# WHERE THE BOOK IS SERVED, and the 404 page is the whole reason this line exists. mdBook writes
# `<base href="{site-url}">` into 404.html alone -- that page answers from any depth, so its assets
# cannot be relative.
#
# THE BOOK IS SERVED AT tinybrains.dev/docs AND NOWHERE ELSE. It ships inside the application's own
# nginx image -- web's Dockerfile copies the rendered book to /usr/share/nginx/html/docs -- so
# /docs/ is the book's root on every deployment there is; with "/" here the not-found page looks
# for its stylesheets one level too high and renders as bare markup. `mdbook serve` overrides this
# with "/" regardless, so the preview is unaffected.
site-url = "/docs/"

# The organisation, not this repository: the icon in the bar is the way to the source of the whole
# platform, and the book is docs/ inside the web repository. There is no `edit-url-template` --
# the pencil it feeds is gone from the bar, so the setting would configure nothing.
git-repository-url = "https://github.com/Tiny-Brains/"

# A STUDIO LINK IS WRITTEN FROM ITS EXAMPLE, NEVER PASTED. A DataLogic Studio link carries its whole
# expression and data in the URL, so a link pasted beside an example is a second copy of it that
# drifts the first time one is edited. studio/studio.py expands `{{#studio example.json}}` into the
# example's code AND a link encoding that same file, on every build. It needs python3, which the
# Rust image the Dockerfile builds the book in already has.
# THE TRANSLATIONS, LAID OVER THE ENGLISH AT BUILD TIME. mdbook-gettext (mdbook-i18n-helpers)
# reads po/<language>.po for the language the build names (MDBOOK_BOOK__LANGUAGE) and puts each
# translated paragraph, heading, list item and table cell in place of its English; one the file
# lacks, or whose English has changed since, stays English. The English build has no catalogue
# and is untouched, which is why the preprocessor is `optional`: `mdbook build` still works on a
# machine without the helpers, and build.sh refuses to build a language without them.
[preprocessor.gettext]
after = ["links"]
optional = true

[preprocessor.studio]
command = "python3 studio/studio.py"
# After gettext, so a directive's expansion is never a message: the link's words come from
# studio.py's own table for the build's language, and an example's `about` from its file.
after = ["links", "gettext"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
